{% extends "base.html" %}

{% block title %}Register – MarketPulse Customer Loyalty Club{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 60px; height: 60px;">
        <i class="bi bi-person-plus-fill fs-2"></i>
      </div>
      <h3 class="fw-bold text-dark">Join Loyalty Club</h3>
      <p class="text-muted small">Create your MarketPulse customer profile</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="mb-3">
        <label for="name" class="form-label fw-semibold">Full Name</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" id="name" name="name" value="{{ name or '' }}" placeholder="e.g. Ananya Sharma" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label fw-semibold">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" placeholder="ananya@example.com" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="phone" class="form-label fw-semibold">Phone Number</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="bi bi-telephone"></i></span>
          <input type="tel" class="form-control" id="phone" name="phone" value="{{ phone or '' }}" placeholder="9876543210" pattern="[0-9]{10}" title="Please enter a valid 10-digit mobile number" required>
        </div>
        <div class="form-text text-muted small">10-digit mobile number for order and loyalty updates.</div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="password" class="form-label fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="password" name="password" minlength="6" placeholder="Min 6 chars" required>
          </div>
        </div>

        <div class="col-md-6 mb-3">
          <label for="confirm_password" class="form-label fw-semibold">Confirm Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-shield-check"></i></span>
            <input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="6" placeholder="Re-type password" required>
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
        <i class="bi bi-check2-circle me-1"></i> Complete Registration
      </button>
    </form>

    <div class="text-center mt-3">
      <span class="text-muted small">Already a registered member?</span>
      <a href="{{ url_for('auth.login') }}" class="small fw-bold text-decoration-none ms-1">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
