{% extends "base.html" %}

{% block title %}Internal Server Error (500) – MarketPulse{% endblock %}

{% block content %}
<div class="text-center py-5">
  <div class="d-inline-flex align-items-center justify-content-center bg-danger bg-opacity-10 text-danger rounded-circle mb-4" style="width: 90px; height: 90px;">
    <i class="bi bi-bug-fill fs-1"></i>
  </div>
  <h1 class="fw-bold display-5 text-dark">500 – Server Error</h1>
  <p class="lead text-muted max-w-700 mx-auto mb-4">
    An unexpected error occurred while processing your request. Please try again or return to the dashboard.
  </p>
  <a href="{{ url_for('index') }}" class="btn btn-primary px-4 py-2">
    <i class="bi bi-arrow-clockwise me-2"></i> Go to Home
  </a>
</div>
{% endblock %}
