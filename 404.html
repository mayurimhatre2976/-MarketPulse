{% extends "base.html" %}

{% block title %}Page Not Found (404) – MarketPulse{% endblock %}

{% block content %}
<div class="text-center py-5">
  <div class="d-inline-flex align-items-center justify-content-center bg-danger bg-opacity-10 text-danger rounded-circle mb-4" style="width: 90px; height: 90px;">
    <i class="bi bi-exclamation-triangle-fill fs-1"></i>
  </div>
  <h1 class="fw-bold display-5 text-dark">404 – Page Not Found</h1>
  <p class="lead text-muted max-w-700 mx-auto mb-4">
    The page or retail loyalty resource you are searching for does not exist or has been relocated.
  </p>
  <a href="{{ url_for('index') }}" class="btn btn-primary px-4 py-2">
    <i class="bi bi-house-door me-2"></i> Return to Homepage
  </a>
</div>
{% endblock %}
